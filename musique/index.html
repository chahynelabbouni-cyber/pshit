  <symbol id="i-timer" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 1 1 10 4.6a6.3 6.3 0 0 0 9.5 9.9z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5.5l11-2.3V16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.6" fill="currentColor"/><circle cx="17.5" cy="16" r="2.6" fill="currentColor"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9.5 6.5V4.3h5v2.2M6.5 6.5l1 13.2h9l1-13.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10.2 12 14.7l4.5-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15.5v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>

<div id="splash"><div class="splash-in"><svg class="splash-logo"><use href="#i-logo"/></svg><div class="splash-word"><small>MAISON</small><b>CHAHYN</b></div></div></div>

<div id="app">
  <main id="main">
    <div id="view" class="view"></div>
  </main>

  <div id="mini" class="mini" hidden>
    <div class="mini-in">
      <div class="mini-cover cover-slot"></div>
      <div class="mini-meta">
        <div class="mini-title marquee"><span></span></div>
        <div class="mini-artist"></div>
      </div>
      <button class="ib mini-like" aria-label="J'aime"><svg><use href="#i-heart"/></svg></button>
      <button class="ib mini-play" aria-label="Lecture"><svg><use href="#i-play"/></svg></button>
    </div>
    <div class="mini-bar"><i></i></div>
  </div>

  <nav class="tabs" id="tabs">
    <a href="#/" data-tab="home"><svg><use href="#i-home-o"/></svg><span>Accueil</span></a>
    <a href="#/search" data-tab="search"><svg><use href="#i-search"/></svg><span>Rechercher</span></a>
    <a href="#/ai" data-tab="ai"><svg><use href="#i-spark-o"/></svg><span>Concierge</span></a>
    <a href="#/library" data-tab="library"><svg><use href="#i-lib"/></svg><span>Bibliothèque</span></a>
  </nav>
</div>

<section id="np" class="np" aria-hidden="true">
  <div class="np-bg"><div class="np-bg-img"></div><div class="np-blob b1"></div><div class="np-blob b2"></div><div class="np-blob b3"></div></div>
  <div class="np-in">
    <header class="np-head">
      <button class="ib" data-act="np-close" aria-label="Fermer"><svg><use href="#i-down"/></svg></button>
      <div class="np-ctx"><small>Lecture depuis</small><b></b></div>
      <button class="ib" data-act="np-more" aria-label="Plus"><svg><use href="#i-more"/></svg></button>
    </header>
    <div class="np-art">
      <canvas class="np-viz"></canvas>
      <div class="np-cover-track">
        <div class="np-cover cover-slot"></div>
      </div>
    </div>
    <div class="np-info">
      <div class="np-text">
        <div class="np-title marquee"><span></span></div>
        <button class="np-artist"></button>
        <div class="np-line" aria-live="off"></div>
      </div>
      <button class="ib np-like" aria-label="J'aime"><svg><use href="#i-heart"/></svg></button>
    </div>
    <div class="np-live"><span class="live-dot">EN DIRECT</span> Radio</div>
    <div class="np-seek">
      <input type="range" min="0" max="1000" value="0" step="1" aria-label="Position">
      <div class="np-times"><span class="t-cur">0:00</span><span class="t-dur">0:00</span></div>
    </div>
    <div class="np-ctrls">
      <button class="ib sm np-shuffle" aria-label="Aléatoire"><svg><use href="#i-shuffle"/></svg></button>
      <button class="ib np-prev" aria-label="Précédent"><svg><use href="#i-prev"/></svg></button>
      <button class="np-play" aria-label="Lecture"><svg><use href="#i-play"/></svg></button>
      <button class="ib np-next" aria-label="Suivant"><svg><use href="#i-next"/></svg></button>
      <button class="ib sm np-repeat" aria-label="Répéter"><svg><use href="#i-repeat"/></svg><em>1</em></button>
    </div>
    <div class="np-foot">
      <button class="ib sm np-sleep" aria-label="Minuteur de sommeil"><svg><use href="#i-timer"/></svg><em></em></button>
      <button class="np-lyr-btn" aria-label="Paroles"><svg><use href="#i-mic"/></svg><span>Paroles</span></button>
      <button class="ib sm np-voice" aria-label="Commande vocale"><svg><use href="#i-mic"/></svg></button>
      <button class="ib sm np-queue" aria-label="File d'attente"><svg><use href="#i-queue"/></svg></button>
    </div>
  </div>
  <div class="lyr">
    <header class="lyr-bar"><button class="ib" data-lyr="close" aria-label="Fermer les paroles"><svg><use href="#i-down"/></svg></button><div class="lyr-head"></div><button class="ib sm" data-lyr="edit" aria-label="Modifier les paroles"><svg><use href="#i-edit"/></svg></button></header>
    <div class="lyr-scroll"><div class="lyr-lines"></div></div>
    <div class="lyr-mini"><button class="ib np-prev" aria-label="Précédent"><svg><use href="#i-prev"/></svg></button><button class="np-play sm" aria-label="Lecture"><svg><use href="#i-play"/></svg></button><button class="ib np-next" aria-label="Suivant"><svg><use href="#i-next"/></svg></button></div>
  </div>
</section>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-scrim"></div>
  <div class="sheet-panel"><div class="sheet-grip"></div><div class="sheet-body"></div></div>
</div>

<div id="voice" class="voice" hidden>
  <button class="ib v-close" aria-label="Fermer"><svg><use href="#i-close"/></svg></button>
  <div class="v-orb" role="button" aria-label="Terminer"><i></i><i></i><i></i><svg><use href="#i-mic"/></svg></div>
  <div class="v-status"><span class="s-l">Je t'écoute…</span><span class="s-t">Je réfléchis…</span><span class="s-s">Le Concierge</span></div>
  <p class="v-said"></p>
  <p class="v-answer"></p>
  <p class="v-hint">Essaie : « Mets une playlist pour l'école », « Joue Nova Ray », « Suivant », « Pause », « C'est quoi ce son ? »</p>
</div>

<div id="ytbox" class="ytbox"><div class="yt-host"></div><div class="yt-shield" title="Ouvrir le lecteur"></div><span class="yt-badge">YouTube</span></div>

<div id="toast" class="toast" role="status"></div>

<input type="file" id="pick-files" accept="audio/*,.mp3,.m4a,.aac,.flac,.ogg,.opus,.wav,.webm" multiple hidden>
<input type="file" id="pick-folder" webkitdirectory multiple hidden>

<script type="module" src="js/app.js?v=8"></script>
</body>
</html>
